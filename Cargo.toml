[package]
name = "yydatastore"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Pure Rust Firebase client (Google sign-in + Cloud Firestore) for native (Windows/macOS/Linux) and WebAssembly"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# JavaScript bindings (wasm-bindgen) for use from JS/TS when compiled to wasm32.
js = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
url = "2"

# ---------- Native (Windows / macOS / Linux) ----------
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "http2", "system-proxy", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["net", "io-util", "time", "macros"] }
getrandom = "0.3"

# ---------- WebAssembly (browser) ----------
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "History"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = "s"
